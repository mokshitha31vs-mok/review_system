apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-system-v3
  labels:
    app: review-system-v3
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-system-v3
  template:
    metadata:
      labels:
        app: review-system-v3
        version: v3
    spec:
      containers:
        - name: review-system
          image: mmokshitha/review-system:v3
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "v3"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
