apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-system-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-system-v3
  template:
    metadata:
      labels:
        app: review-system-v3
    spec:
      containers:
        - name: review-system
          image: mmokshitha/review-system:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v3"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: review-system-v3
spec:
  type: NodePort
  selector:
    app: review-system-v3
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30083
